# Home Assistant app manifest for Camon.
# The implementation and image build are maintained at https://github.com/nsg/camon.
name: Camon
slug: camon
version: "0.6.4"
description: Multi-camera NVR with real-time motion/object analytics and tiered storage
url: https://github.com/nsg/camon
arch:
  - amd64

# The version above selects the matching tag from Camon's GHCR package.
image: ghcr.io/nsg/{arch}-addon-camon

startup: application
boot: auto
init: false
timeout: 300

ingress: true
ingress_port: 22666
panel_icon: mdi:cctv
panel_title: Camon
panel_admin: true

services:
  - mqtt:want

map:
  - addon_config:rw
